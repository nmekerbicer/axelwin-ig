name: Pull insights and check token

on:
  schedule:
    # Mondays 06:10 UTC, before the week's batch gets planned.
    - cron: "10 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  insights:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pull insights
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          GRAPH_VERSION: ${{ vars.GRAPH_VERSION || 'v23.0' }}
        run: python scripts/insights.py

      - name: Commit insights
        run: |
          if [ -n "$(git status --porcelain data)" ]; then
            git config user.name "axelwin-bot"
            git config user.email "actions@github.com"
            git add data
            git commit -m "insights: weekly pull [skip ci]"
            git pull --rebase --autostash
            git push
          fi

      - name: Check token expiry
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          GRAPH_VERSION: ${{ vars.GRAPH_VERSION || 'v23.0' }}
        run: python scripts/token_check.py
