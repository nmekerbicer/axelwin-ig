name: Publish due Instagram posts

on:
  schedule:
    # Every 10 minutes. GitHub queues cron runs under load, so a post can go
    # out a few minutes after its slot. Instagram timing does not need to be
    # exact to the minute.
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate assets without publishing"
        type: boolean
        default: false

concurrency:
  group: instagram-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Publish
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          ASSET_BASE_URL: ${{ vars.ASSET_BASE_URL }}
          GRAPH_VERSION: ${{ vars.GRAPH_VERSION || 'v23.0' }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: python scripts/publish.py

      - name: Commit queue state
        if: always()
        run: |
          if [ -n "$(git status --porcelain queue.json data)" ]; then
            git config user.name "axelwin-bot"
            git config user.email "actions@github.com"
            git add queue.json data
            git commit -m "publish run: update queue state [skip ci]"
            git pull --rebase --autostash
            git push
          fi
