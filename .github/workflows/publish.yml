name: Publish due Instagram posts

on:
  schedule:
    # Every 5 minutes, deliberately off the top of the hour. GitHub drops
    # scheduled runs under load, and :00 is the worst minute to ask for.
    - cron: "3,8,13,18,23,28,33,38,43,48,53,58 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate assets without publishing"
        type: boolean
        default: false

concurrency:
  group: instagram-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Hold this runner until the slot
        if: ${{ !inputs.dry_run }}
        run: |
          T=$(python3 -c "import json;q=json.load(open('queue.json'));p=sorted(x['publish_at'] for x in q['posts'] if x.get('status')=='pending');print(p[0] if p else '')")
          if [ -z "$T" ]; then echo "no pending posts, nothing to hold for"; exit 0; fi
          TS=$(date -u -d "$T" +%s); NOW=$(date -u +%s); W=$((TS-NOW))
          echo "next pending slot $T, $W seconds away"
          if [ "$W" -gt 0 ] && [ "$W" -le 14400 ]; then echo "holding this runner until the slot"; sleep "$W"; sleep 10; fi

      - name: Publish
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          ASSET_BASE_URL: ${{ vars.ASSET_BASE_URL }}
          GRAPH_VERSION: ${{ vars.GRAPH_VERSION || 'v23.0' }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: python scripts/publish.py

      - name: Commit queue state
        if: always()
        run: |
          if [ -n "$(git status --porcelain queue.json data)" ]; then
            git config user.name "axelwin-bot"
            git config user.email "actions@github.com"
            git add queue.json data
            git commit -m "publish run: update queue state [skip ci]"
            git pull --rebase --autostash
            git push
          fi
